<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>webspark-test</title>
    <script type="module" crossorigin src="/webspark-test/assets/index-DI38SDwx.js"></script>
    <link rel="stylesheet" crossorigin href="/webspark-test/assets/index-BsmYzSiw.css">
  </head>
  <body>
    <div class="page">
      <header class="header">
        <div class="container">
          <div class="header__inner">
            <div class="header__logo">
              <img src="/webspark-test/images/logo.png" alt="Monblan logo" />
            </div>

            <div class="header__profile">
              <div class="header__heading">
                <h3 class="header__title">monblanproject</h3>
                <span class="header__badge" >
                  Start on 17.02.2016
                </span>
              </div>
              <ul class="header__stats">
                <li class="header__stat">
                  <span class="header__stat-value">870</span>
                  <span class="header__stat-label">posts</span>
                </li>
                <li class="header__stat">
                  <span class="header__stat-value">11,787</span>
                  <span class="header__stat-label">followers</span>
                </li>
                <li class="header__stat">
                  <span class="header__stat-value">112</span>
                  <span class="header__stat-label">following</span>
                </li>
              </ul>

              <div class="filters">
                <label class="filters__label" for="date-from">Date</label>

                <div class="filters__field">
                  <input
                    id="date-from"
                    type="text"
                    class="filters__input"
                    placeholder="from"
                    autocomplete="off"
                  />
                  <button
                    class="filters__icon-button filters__icon-button--clear"
                    type="button"
                    aria-label="Clear date from"
                    data-clear="date-from"
                  >
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <path d="M17.6569 16.2426L13.4142 12L17.6569 7.75736L16.2426 6.34315L12 10.5858L7.75736 6.34315L6.34315 7.75736L10.5858 12L6.34315 16.2426L7.75736 17.6569L12 13.4142L16.2426 17.6569L17.6569 16.2426Z" fill="#5F5F5F"/>
                    </svg>
                  </button>
                  <button
                    class="filters__icon-button filters__icon-button--calendar"
                    type="button"
                    aria-label="Open calendar from"
                    data-open="date-from"
                  >
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <path d="M7 11H9V13H7V11ZM7 15H9V17H7V15ZM11 11H13V13H11V11ZM11 15H13V17H11V15ZM15 11H17V13H15V11ZM15 15H17V17H15V15Z" fill="#5F5F5F"/>
                      <path d="M5 22H19C20.103 22 21 21.103 21 20V6C21 4.897 20.103 4 19 4H17V2H15V4H9V2H7V4H5C3.897 4 3 4.897 3 6V20C3 21.103 3.897 22 5 22ZM19 8L19.001 20H5V8H19Z" fill="#5F5F5F"/>
                    </svg>
                  </button>
                </div>

                <div class="filters__field filters__field--right">
                  <input
                    id="date-to"
                    type="text"
                    class="filters__input"
                    placeholder="to"
                    autocomplete="off"
                  />
                  <button
                    class="filters__icon-button filters__icon-button--clear"
                    type="button"
                    aria-label="Clear date to"
                    data-clear="date-to"
                  >
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <path d="M17.6569 16.2426L13.4142 12L17.6569 7.75736L16.2426 6.34315L12 10.5858L7.75736 6.34315L6.34315 7.75736L10.5858 12L6.34315 16.2426L7.75736 17.6569L12 13.4142L16.2426 17.6569L17.6569 16.2426Z" fill="#5F5F5F"/>
                    </svg>
                  </button>
                  <button
                    class="filters__icon-button filters__icon-button--calendar"
                    type="button"
                    aria-label="Open calendar to"
                    data-open="date-to"
                  >
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <path d="M7 11H9V13H7V11ZM7 15H9V17H7V15ZM11 11H13V13H11V11ZM11 15H13V17H11V15ZM15 11H17V13H15V11ZM15 15H17V17H15V15Z" fill="#5F5F5F"/>
                      <path d="M5 22H19C20.103 22 21 21.103 21 20V6C21 4.897 20.103 4 19 4H17V2H15V4H9V2H7V4H5C3.897 4 3 4.897 3 6V20C3 21.103 3.897 22 5 22ZM19 8L19.001 20H5V8H19Z" fill="#5F5F5F"/>
                    </svg>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </header>


      <main class="main">
        <section class="gallery gallery--rows" id="gallery">
          <div class="container">
            <div class="gallery__toolbar">
              <div class="gallery__view-switch">
                <button
                  class="gallery__view-btn gallery__view-btn--rows is-active"
                  type="button"
                  data-view="rows"
                  aria-label="Rows view"
                >
                  <svg width="24" height="22" viewBox="0 0 24 22" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="1"  y="0"  width="6" height="6" rx="1" fill="#C8C8C8"/>
                    <rect x="9"  y="0"  width="6" height="6" rx="1" fill="#C8C8C8"/>
                    <rect x="17" y="0"  width="6" height="6" rx="1" fill="#C8C8C8"/>

                    <rect x="1"  y="8"  width="6" height="6" rx="1" fill="#C8C8C8"/>
                    <rect x="9"  y="8"  width="6" height="6" rx="1" fill="#C8C8C8"/>
                    <rect x="17" y="8"  width="6" height="6" rx="1" fill="#C8C8C8"/>

                    <rect x="1"  y="16" width="6" height="6" rx="1" fill="#C8C8C8"/>
                    <rect x="9"  y="16" width="6" height="6" rx="1" fill="#C8C8C8"/>
                    <rect x="17" y="16" width="6" height="6" rx="1" fill="#C8C8C8"/>
                  </svg>
                </button>

                <button
                  class="gallery__view-btn gallery__view-btn--tiles"
                  type="button"
                  data-view="tiles"
                  aria-label="Tiles view"
                >
                  <svg width="24" height="22" viewBox="0 0 24 22" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="6" height="6" fill="#C8C7C7"/>
                    <rect y="8" width="6" height="6" fill="#C8C7C7"/>
                    <rect y="16" width="6" height="6" fill="#C8C7C7"/>
                    <rect x="9" y="10" width="15" height="2" fill="#C8C7C7"/>
                    <rect x="9" y="18" width="15" height="2" fill="#C8C7C7"/>
                    <rect x="9" y="2" width="15" height="2" fill="#C8C7C7"/>
                  </svg>
                </button>
              </div>
            </div>
            
            <div class="gallery__list" id="gallery-list"></div>

            <button class="gallery__load-more" type="button">
              Load more
            </button>
          </div>

        </section>
      </main>
    </div>

  </body>

</html>
