<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>webspark-test</title>
  </head>
  <body>
    <div class="page">
      <header class="header">
        <div class="container">
          <div class="header__inner">
            <div class="header__logo">
              <img src="/images/logo.png" alt="Monblan logo" />
            </div>

            <div class="header__profile">
              <div class="header__heading">
                <h3 class="header__title">monblanproject</h3>
                <span class="header__badge" >
                  Start on 17.02.2016
                </span>
              </div>
              <ul class="header__stats">
                <li class="header__stat">
                  <span class="header__stat-value">870</span>
                  <span class="header__stat-label">posts</span>
                </li>
                <li class="header__stat">
                  <span class="header__stat-value">11,787</span>
                  <span class="header__stat-label">followers</span>
                </li>
                <li class="header__stat">
                  <span class="header__stat-value">112</span>
                  <span class="header__stat-label">following</span>
                </li>
              </ul>

              <div class="filters">
                <label class="filters__label" for="date-from">Date</label>

                <div class="filters__field">
                  <input
                    id="date-from"
                    type="text"
                    class="filters__input"
                    placeholder="from"
                    autocomplete="off"
                  />
                  <button
                    class="filters__icon-button filters__icon-button--clear"
                    type="button"
                    aria-label="Clear date from"
                    data-clear="date-from"
                  >
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <path d="M17.6569 16.2426L13.4142 12L17.6569 7.75736L16.2426 6.34315L12 10.5858L7.75736 6.34315L6.34315 7.75736L10.5858 12L6.34315 16.2426L7.75736 17.6569L12 13.4142L16.2426 17.6569L17.6569 16.2426Z" fill="#5F5F5F"/>
                    </svg>
                  </button>
                  <button
                    class="filters__icon-button filters__icon-button--calendar"
                    type="button"
                    aria-label="Open calendar from"
                    data-open="date-from"
                  >
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <path d="M7 11H9V13H7V11ZM7 15H9V17H7V15ZM11 11H13V13H11V11ZM11 15H13V17H11V15ZM15 11H17V13H15V11ZM15 15H17V17H15V15Z" fill="#5F5F5F"/>
                      <path d="M5 22H19C20.103 22 21 21.103 21 20V6C21 4.897 20.103 4 19 4H17V2H15V4H9V2H7V4H5C3.897 4 3 4.897 3 6V20C3 21.103 3.897 22 5 22ZM19 8L19.001 20H5V8H19Z" fill="#5F5F5F"/>
                    </svg>
                  </button>
                </div>

                <div class="filters__field filters__field--right">
                  <input
                    id="date-to"
                    type="text"
                    class="filters__input"
                    placeholder="to"
                    autocomplete="off"
                  />
                  <button
                    class="filters__icon-button filters__icon-button--clear"
                    type="button"
                    aria-label="Clear date to"
                    data-clear="date-to"
                  >
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <path d="M17.6569 16.2426L13.4142 12L17.6569 7.75736L16.2426 6.34315L12 10.5858L7.75736 6.34315L6.34315 7.75736L10.5858 12L6.34315 16.2426L7.75736 17.6569L12 13.4142L16.2426 17.6569L17.6569 16.2426Z" fill="#5F5F5F"/>
                    </svg>
                  </button>
                  <button
                    class="filters__icon-button filters__icon-button--calendar"
                    type="button"
                    aria-label="Open calendar to"
                    data-open="date-to"
                  >
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <path d="M7 11H9V13H7V11ZM7 15H9V17H7V15ZM11 11H13V13H11V11ZM11 15H13V17H11V15ZM15 11H17V13H15V11ZM15 15H17V17H15V15Z" fill="#5F5F5F"/>
                      <path d="M5 22H19C20.103 22 21 21.103 21 20V6C21 4.897 20.103 4 19 4H17V2H15V4H9V2H7V4H5C3.897 4 3 4.897 3 6V20C3 21.103 3.897 22 5 22ZM19 8L19.001 20H5V8H19Z" fill="#5F5F5F"/>
                    </svg>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </header>


      <main class="main">
        <section class="gallery gallery--rows" id="gallery">
          <div class="gallery__inner">
            <div class="gallery__list">
              <!-- ОДНА розмітка картки, яка працює і в rows, і в tiles -->

              <article class="post">
                <div class="post__image">
                  <img src="/images/photo-1.jpg" alt="Post image 1" />
                </div>
                <div class="post__content">
                  <div class="post__top">
                    <div class="post__title">Today</div>

                    <div class="post__stats">
                      <div class="post__stat">
                        <!-- тут заміниш на SVG-іконку -->
                        <span class="post__icon">❤</span>
                        <span class="post__value">128</span>
                      </div>
                      <div class="post__stat">
                        <span class="post__icon">💬</span>
                        <span class="post__value">31</span>
                      </div>
                      <div class="post__stat">
                        <span class="post__icon">👁</span>
                        <span class="post__value">22</span>
                      </div>
                    </div>

                    <div class="post__date">9-08-2016</div>
                  </div>

                  <div class="post__bottom">
                    <span class="post__type">Image upload</span>
                    <span class="post__created">11-04-2016</span>
                  </div>
                </div>
              </article>

              <!-- ще кілька таких же .post з іншими картинками/даними -->
              <article class="post">
                <div class="post__image">
                  <img src="/images/photo-2.jpg" alt="Post image 2" />
                </div>
                <div class="post__content">
                  <div class="post__top">
                    <div class="post__title">Today</div>
                    <div class="post__stats">
                      <div class="post__stat">
                        <span class="post__icon">❤</span>
                        <span class="post__value">128</span>
                      </div>
                      <div class="post__stat">
                        <span class="post__icon">💬</span>
                        <span class="post__value">31</span>
                      </div>
                      <div class="post__stat">
                        <span class="post__icon">👁</span>
                        <span class="post__value">22</span>
                      </div>
                    </div>
                    <div class="post__date">9-08-2016</div>
                  </div>
                  <div class="post__bottom">
                    <span class="post__type">Image upload</span>
                    <span class="post__created">11-04-2016</span>
                  </div>
                </div>
              </article>
            </div>

            <button class="gallery__load-more" type="button">
              Load more
            </button>
          </div>
        </section>
      </main>

      <footer class="footer">
        <div class="footer__inner">
          <p class="footer__text">© 2016 monblanproject</p>
        </div>
      </footer>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>

</html>
